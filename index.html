            flex-direction: column;

            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 0.5rem;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .company-info h1 { font-size: 1.3rem; font-weight: 700; }
        .company-info p { font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); }
        .container { display: flex; flex: 1; overflow: hidden; }
        aside {
            width: 250px;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-item {
            padding: 1rem 2rem;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .sidebar-item.expandable { font-weight: 600; }
        .submenu { display: none; flex-direction: column; background: rgba(0, 0, 0, 0.2); }
        .submenu.active { display: flex; }
        .submenu-item {
            padding: 0.75rem 2.5rem;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: color 0.3s;
            font-size: 0.95rem;
        }
        .submenu-item.sub-level {
            padding-left: 3.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .submenu-item.sub-level:hover { color: rgba(255, 255, 255, 0.9); }
        .submenu-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-y: auto;
        }
        .welcome-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 3rem;
            max-width: 700px;
            text-align: center;
            line-height: 1.6;
        }
        .welcome-box h2 { font-size: 2.5rem; margin-bottom: 1.5rem; font-weight: 700; }
        .welcome-box p { font-size: 1.1rem; color: rgba(255, 255, 255, 0.9); line-height: 1.8; }
        .welcome-box h3 { font-size: 1.3rem; margin-top: 2rem; margin-bottom: 1rem; text-align: left; }
        .welcome-box ul { text-align: left; margin: 1rem 0; padding-left: 2rem; }
        .welcome-box li { margin: 0.5rem 0; color: rgba(255, 255, 255, 0.85); }

            color: #334155;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;

            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);

            border: 1px solid rgba(255, 255, 255, 0.2);

            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;

            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);

            margin-top: 0.5rem;

            text-align: left;

            aside {

                position: fixed;
                left: 0;
                top: 60px;
                width: 100%;

            .mobile-menu-btn {
                display: block;
                background: transparent;
                border: none;
                color: white;
                font-size: 1.5rem;
                cursor: pointer;
            }
            .container { flex-direction: column; }
            main { padding: 1rem; }
            .welcome-box { padding: 1.5rem; }
            .welcome-box h2 { font-size: 1.5rem; }
        }

                'ironHegemony':  { privacyPolicy: 'Iron_Hegemony_privacy-policy_ko.html',     termsOfService: 'Iron_Hegemony_Terms_of_Service_ko.html' },
                'marketSniper':  { privacyPolicy: 'Market_Sniper_privacy-policy_ko.html',     termsOfService: 'Market_Sniper_Terms_of_Service_ko.html' }
            }
        };

        let currentLang = localStorage.getItem('language') || 'en';
        let currentPage = 'home';

        const langNames = {
            'en': 'English',
            'zh-CN': '简体中文',
            'zh-TW': '繁體中文',
            'ja': '日本語',
            'ko': '한국어'
        };

        function toggleMobileMenu() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            if (submenu) { submenu.classList.toggle('active'); }
        }

        function toggleLangMenu() {
            document.getElementById('langMenu').classList.toggle('active');
        }

        function openDoc(appName, docType) {
            const url = documentURLs[currentLang][appName][docType];
            window.open(url, '_blank');
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            document.getElementById('langText').textContent = langNames[lang];
            document.getElementById('langMenu').classList.remove('active');
            updateUI();
            showPage(currentPage);
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('productListLabel').textContent = t.productList;
            document.getElementById('aboutUsLabel').textContent = t.aboutUs;
            document.querySelectorAll('.privacy-label').forEach(el => el.textContent = t.privacyPolicy);
            document.querySelectorAll('.terms-label').forEach(el => el.textContent = t.termsOfService);
        }

        function showPage(page) {
            currentPage = page;
            const content = document.getElementById('content');
            const t = translations[currentLang];

            if (page === 'about') {
                content.innerHTML = `
                    <div class="welcome-box">
                        <h2>${t.aboutTitle}</h2>
                        <p style="text-align: left; margin-top: 1rem;">${t.aboutText}</p>
                        <h3>${t.missionTitle}</h3>
                        <p style="text-align: left; margin-bottom: 1.5rem;">${t.missionText}</p>
                        <h3>${t.visionTitle}</h3>
                        <p style="text-align: left; margin-bottom: 1.5rem;">${t.visionText}</p>
                        <h3>${t.valuesTitle}</h3>
                        <ul>
                            <li>✓ ${t.value1}</li>
                            <li>✓ ${t.value2}</li>
                            <li>✓ ${t.value3}</li>
                            <li>✓ ${t.value4}</li>
                        </ul>
                        <h3>${t.teamTitle}</h3>
                        <p style="text-align: left; margin-bottom: 1.5rem;">${t.teamText}</p>
                        <button class="btn" onclick="showPage('home')">${t.backHome}</button>
                    </div>
                `;
            } else if (page === 'home') {
                content.innerHTML = `
                    <div class="welcome-box">
                        <h2>${t.welcomeTitle}</h2>
                        <p>${t.welcomeText}</p>
                    </div>
                `;
            }
            document.getElementById('sidebar').classList.remove('mobile-open');
        }

        // 初始化
        document.getElementById('langText').textContent = langNames[currentLang];
        updateUI();
        showPage('home');
    </script>
</body>
</html>
